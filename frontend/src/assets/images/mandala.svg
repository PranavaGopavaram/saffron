<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D5A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8D5A3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="240" fill="url(#glowGrad)" opacity="0.3"/>
  
  <!-- Main outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Decorative outer border -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="40" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="256" cy="256" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="12" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- 8 Large petals -->
  <g opacity="0.6">
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(0 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(45 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(90 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(135 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(180 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(225 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(270 256 256)"/>
    <ellipse cx="256" cy="90" rx="20" ry="45" fill="url(#goldGrad)" transform="rotate(315 256 256)"/>
  </g>
  
  <!-- 8 Small petals between -->
  <g opacity="0.4">
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(22.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(67.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(112.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(157.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(202.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(247.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(292.5 256 256)"/>
    <ellipse cx="256" cy="130" rx="12" ry="25" fill="url(#goldGrad)" transform="rotate(337.5 256 256)"/>
  </g>
  
  <!-- Decorative dots around middle ring -->
  <g fill="url(#goldGrad)" opacity="0.5">
    <circle cx="256" cy="80" r="4"/>
    <circle cx="362" cy="150" r="4"/>
    <circle cx="432" cy="256" r="4"/>
    <circle cx="362" cy="362" r="4"/>
    <circle cx="256" cy="432" r="4"/>
    <circle cx="150" cy="362" r="4"/>
    <circle cx="80" cy="256" r="4"/>
    <circle cx="150" cy="150" r="4"/>
  </g>
  
  <!-- Corner flourishes -->
  <g opacity="0.4" fill="url(#goldGrad)">
    <!-- Top -->
    <path d="M256 40 Q270 60 256 80 Q242 60 256 40"/>
    <!-- Bottom -->
    <path d="M256 472 Q270 452 256 432 Q242 452 256 472"/>
    <!-- Left -->
    <path d="M40 256 Q60 242 80 256 Q60 270 40 256"/>
    <!-- Right -->
    <path d="M472 256 Q452 242 432 256 Q452 270 472 256"/>
  </g>
</svg>