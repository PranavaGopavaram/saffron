<div class="auth-page">
  <div class="auth-shell">
    <section class="auth-media" aria-label="Saffron image">
      <div class="auth-media-inner">
        <img src="assets/saffron.png" alt="Saffron Flower" />
        <p class="auth-media-tagline">Saffron Marketplace</p>
      </div>
    </section>

    <main class="auth-panel" aria-label="Login">
      <div class="auth-card">
        <header class="auth-head">
          <p class="auth-kicker">Welcome back</p>
          <h1 class="auth-title">Sign in</h1>
          <p class="auth-subtitle">Continue your journey from thread to table.</p>
        </header>

        <div class="banner banner-error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="banner banner-success" *ngIf="successMessage">{{ successMessage }}</div>

        <form class="auth-form" (ngSubmit)="onLogin()">
          <label class="field">
            <span class="label">Email</span>
            <input
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="email"
              name="email"
              [disabled]="isLoading"
              required
              autocomplete="email"
            />
          </label>

          <label class="field">
            <span class="label">Password</span>
            <input
              type="password"
              placeholder="Your password"
              [(ngModel)]="password"
              name="password"
              [disabled]="isLoading"
              required
              autocomplete="current-password"
            />
          </label>

          <div class="auth-row">
            <button class="link" type="button" (click)="onForgotPassword()" [disabled]="isLoading">
              Forgot password?
            </button>
          </div>

          <button type="submit" class="primary" [disabled]="isLoading">
            <span *ngIf="!isLoading">Sign in</span>
            <span *ngIf="isLoading">Signing in...</span>
          </button>
        </form>

        <p class="auth-foot">
          New here?
          <a routerLink="/auth/registration">Create an account</a>
        </p>
      </div>
    </main>
  </div>

  <app-buyer-footer></app-buyer-footer>
</div>
