<div class="product-list-container">
  <!-- Header -->
  <header class="page-header">
    <div class="header-content">
      <h1>Saffron Marketplace</h1>
      <p class="header-subtitle">Discover premium quality saffron from verified sellers</p>
    </div>
    <div class="header-actions">
      <button class="filter-toggle-btn" (click)="toggleFilters()">
        <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
        Filters
        @if (hasActiveFilters) {
          <span class="filter-badge"></span>
        }
      </button>
      <a routerLink="/buyer/cart" class="cart-link">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Cart
      </a>
    </div>
  </header>

  <div class="main-content">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar" [class.show]="showFilters">
      <div class="filters-header">
        <h2>Filters</h2>
        <button class="close-filters" (click)="showFilters = false" aria-label="Close filters">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Grade</label>
        <select class="filter-select" [(ngModel)]="selectedGrade">
          @for (option of gradeOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Price Range</label>
        <div class="price-inputs">
          <input 
            type="number" 
            class="filter-input" 
            placeholder="Min" 
            [(ngModel)]="minPrice"
            [min]="0" />
          <span class="price-separator">-</span>
          <input 
            type="number" 
            class="filter-input" 
            placeholder="Max" 
            [(ngModel)]="maxPrice"
            [min]="0" />
        </div>
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Origin</label>
        <input 
          type="text" 
          class="filter-input full-width" 
          placeholder="e.g. Kashmir, Iran" 
          [(ngModel)]="originSearch" />
      </div>
      
      <div class="filter-actions">
        <button class="btn-apply" (click)="applyFilters()">Apply Filters</button>
        @if (hasActiveFilters) {
          <button class="btn-clear" (click)="clearFilters()">Clear All</button>
        }
      </div>
    </aside>

    <!-- Products Grid -->
    <main class="products-main">
      @if (isLoading) {
        <app-loading-spinner message="Loading products..."></app-loading-spinner>
      } @else if (error) {
        <app-empty-state
          icon="error"
          [title]="'Something went wrong'"
          [message]="error"
          actionLabel="Try Again"
          (action)="loadProducts()">
        </app-empty-state>
      } @else if (products.length === 0) {
        <app-empty-state
          icon="search"
          title="No products found"
          [message]="hasActiveFilters ? 'Try adjusting your filters' : 'Check back later for new products'"
          [actionLabel]="hasActiveFilters ? 'Clear Filters' : ''"
          (action)="clearFilters()">
        </app-empty-state>
      } @else {
        <div class="products-grid">
          @for (product of products; track product.product.id) {
            <app-product-card
              [product]="product"
              (addToCart)="onAddToCart($event)">
            </app-product-card>
          }
        </div>
        
        <app-pagination
          [currentPage]="filters.page"
          [totalItems]="totalProducts"
          [itemsPerPage]="filters.limit"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      }
    </main>
  </div>
  
  <!-- Mobile filter overlay -->
  @if (showFilters) {
    <div class="filter-overlay" (click)="showFilters = false"></div>
  }
</div>
