<app-buyer-header></app-buyer-header>

<div class="product-list-container">
  <div class="main-content">
    
    <aside class="filters-sidebar">
      <div class="filters-header">
        <h2>Filters</h2>
        <button class="close-filters" (click)="toggleFilters()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="filter-section">
        <span class="filter-label">Grade</span>
        <div class="radio-group">
          <label class="radio-item" *ngFor="let grade of gradeOptions">
            <input 
              type="radio" 
              name="grade" 
              [value]="grade.value" 
              [(ngModel)]="selectedGrade"
              (ngModelChange)="onGradeChange()">
            <span class="radio-text">{{ grade.label }}</span>
          </label>
        </div>
      </div>

      <div class="filter-section">
        <label class="filter-label">Origin</label>
        <select class="filter-select" [(ngModel)]="originSearch" (ngModelChange)="onOriginChange()">
          <option value="">All Origins</option>
          <option value="Iran">Iran</option>
          <option value="India">India</option>
          <option value="Spain">Spain</option>
          <option value="Greece">Greece</option>
        </select>
      </div>

      <div class="filter-section">
        <span class="filter-label">Price Range (₹)</span>
        <div class="price-inputs">
          <input 
            type="number" 
            class="filter-input" 
            placeholder="Min" 
            [(ngModel)]="minPrice"
            (ngModelChange)="onPriceChange()">
          <span class="price-separator">-</span>
          <input 
            type="number" 
            class="filter-input" 
            placeholder="Max" 
            [(ngModel)]="maxPrice"
            (ngModelChange)="onPriceChange()">
        </div>
      </div>

      <div class="filter-section">
        <label class="filter-label">Sort By</label>
        <select class="filter-select" [(ngModel)]="selectedSort" (ngModelChange)="onSortChange()">
          <option *ngFor="let sort of sortOptions" [value]="sort.value">
            {{ sort.label }}
          </option>
        </select>
      </div>

      <div class="filter-actions">
        <button class="btn-apply" (click)="applyFilters()">Apply Filters</button>
        <button class="btn-clear" (click)="clearFilters()">Clear All</button>
      </div>
    </aside>
    <main class="products-main">
      <div class="page-controls">
        <button class="filter-toggle-btn" (click)="toggleFilters()">
          <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
          Filters
          <span class="filter-badge" *ngIf="hasActiveFilters"></span>
        </button>
      </div>
      
      <div *ngIf="error" class="error-message">{{ error }}</div>
      
      <div *ngIf="isLoading" class="loading">Loading products...</div>

      <ng-container *ngIf="!isLoading && !error">
        <div class="results-summary">
          <span class="product-count">{{ totalProducts }} products found</span>
        </div>
        
        <div class="products-grid">
          <ng-container *ngIf="products.length > 0; else noProducts">
            <app-product-card
              *ngFor="let product of products; trackBy: trackProductId"
              [product]="product"
              [showAddToCart]="false"
              (addToCart)="onAddToCart($event)">
            </app-product-card>
          </ng-container>
          <ng-template #noProducts>
            <div class="empty-state">No products found</div>
          </ng-template>
        </div>
      </ng-container>
    </main>
  </div>
</div>

<app-buyer-footer></app-buyer-footer>
