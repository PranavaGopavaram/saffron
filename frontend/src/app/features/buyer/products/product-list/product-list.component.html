<div class="product-list-container">
  <header class="page-header">
    <div class="header-top">
      <div class="header-branding">
        <h1>Saffron Marketplace</h1>
        <p class="header-subtitle">Discover premium quality saffron from verified sellers</p>
      </div>
    </div>
  </header>

  <div class="main-content">
  
    <main class="products-main">
      <div *ngIf="error" class="error-message">{{ error }}</div>
      
      <div *ngIf="isLoading" class="loading">Loading products...</div>

      <ng-container *ngIf="!isLoading && !error">
        <div class="results-summary">
          <span class="product-count">Debug: {{ totalProducts }} products, {{ products.length }} loaded, loading={{isLoading}}</span>
        </div>
        
        <div class="products-grid">
          <ng-container *ngIf="products.length > 0; else noProducts">
            <app-product-card
              *ngFor="let product of products; trackBy: trackProductId"
              [product]="product"
              [showAddToCart]="false"
              (addToCart)="onAddToCart($event)">
            </app-product-card>
          </ng-container>
          <ng-template #noProducts>
            <div class="empty-state">No products found</div>
          </ng-template>
        </div>
      </ng-container>
    </main>
  </div>
</div>
