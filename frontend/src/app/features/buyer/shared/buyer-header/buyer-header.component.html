<header class="buyer-header">
  <div class="header-brand">
    <h1>Saffron Marketplace</h1>
    <span class="welcome-text" *ngIf="user()">Welcome, {{ user()?.fullName }}</span>
  </div>
  
  <nav class="header-nav">
    <a routerLink="/buyer/home" routerLinkActive="active" class="nav-link">Home</a>
    <a routerLink="/buyer/products" routerLinkActive="active" class="nav-link">Browse</a>
    <a routerLink="/buyer/cart" routerLinkActive="active" class="nav-link">
      Cart
      <span class="cart-badge" *ngIf="cartItemCount() > 0">{{ cartItemCount() }}</span>
    </a>
    <a routerLink="/buyer/orders" routerLinkActive="active" class="nav-link">Orders</a>
    <a routerLink="/buyer/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
  </nav>
  
  <button class="logout-btn" (click)="onLogout()">Logout</button>
</header>
