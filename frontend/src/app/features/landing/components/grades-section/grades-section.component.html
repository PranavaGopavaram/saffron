<section id="grades-section" class="grades-section">
  <h2 class="section-title">Choose your Saffron Grade</h2>
  
  <div class="grades-container">
    <div class="grade-card" *ngFor="let grade of grades">
      <h3 class="grade-title">{{ grade.title }}</h3>
      <div class="grade-image">
        <img [src]="grade.imageUrl" [alt]="grade.name">
      </div>
      <p class="grade-description">{{ grade.description }}</p>
      <button class="grade-btn">{{ grade.buttonText }}</button>
    </div>
  </div>
  
  <div class="explore-all-section">
    <button class="explore-all-btn">Explore all grades</button>
    <p class="explore-all-text">
      Not sure which one you need? Browse our entire collection of premium saffron.
    </p>
  </div>
</section>
